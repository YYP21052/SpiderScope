server {
    listen 80;
    server_name localhost;

    # 1. 前端静态文件 (Vue Build)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # ⚠️ 关键配置：解决 Vue History 模式刷新 404 问题
        try_files $uri $uri/ /index.html;
    }

    # 2. 反向代理后端 API
    # 将 /api/ 开头的请求转发给 backend 容器
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 3. 反向代理 Django Admin 后台 (可选)
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    # 4. 代理 Django 静态文件 (admin样式等)
    # 需确保 backend 做了 collectstatic，这里简化处理，也可让 nginx 直接 serve
    location /static/ {
        proxy_pass http://backend:8000; 
    }
}
